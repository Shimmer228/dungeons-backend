
  services:
    postgres:
      image: postgres:16-alpine
      container_name: dungeons_db
      restart: always
      environment:
        POSTGRES_USER: devuser
        POSTGRES_PASSWORD: devpassword
        POSTGRES_DB: dungeons_db
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: